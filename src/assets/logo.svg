<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="plumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b3771"/>
      <stop offset="50%" stop-color="#802c5c"/>
      <stop offset="100%" stop-color="#541b3c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ca94"/>
      <stop offset="50%" stop-color="#ad8b73"/>
      <stop offset="100%" stop-color="#8a6750"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="12" flood-color="#541b3c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container for high contrast favicon/app icon readability -->
  <rect width="512" height="512" rx="128" fill="#fdfaf7"/>

  <g filter="url(#shadow)">
    <!-- Main Outer Loop Plum Stroke -->
    <path d="M 160 410 C 160 410 160 170 160 140 C 160 85 205 45 275 45 C 355 45 405 95 405 185 C 405 275 345 325 265 325 L 160 325" 
          fill="none" 
          stroke="url(#plumGrad)" 
          stroke-width="58" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Overlapping Inner Ribbon Gold Stroke -->
    <path d="M 200 425 C 200 425 200 240 200 175 C 200 130 230 95 285 95 C 340 95 365 135 365 185 C 365 240 335 275 275 275 L 140 275 C 100 275 80 320 110 365 C 130 395 160 415 200 425" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>